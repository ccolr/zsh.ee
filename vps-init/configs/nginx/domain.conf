# =========================================================
# 公网 HTTP 80：
# ACME HTTP-01 验证，并将所有普通请求统一到 https://eva.cm
# =========================================================
server {
	listen 80;
	listen [::]:80;
	server_name star.eva.cm;
    root /home/otmno/www/evacm;

    # acme.sh HTTP-01 验证文件：不要重定向
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

	location / {
		return 301 https://star.eva.cm$request_uri;
	}
}

# =========================================================
# 本机 HTTPS 10443：eva.cm 实际网站
# =========================================================
server {
	listen 127.0.0.1:10443 ssl;
	listen [::1]:10443 ssl;
	server_name star.eva.cm;
	root /home/otmno/www/evacm;
	ssl_certificate /etc/nginx/ssl/star.eva.cm/fullchain.crt;
	ssl_certificate_key /etc/nginx/ssl/star.eva.cm/cert.key;

	ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:eva_TLS:10m;
    ssl_session_timeout 1h;

    # 避免 Nginx自动生成的重定向暴露内部端口
    port_in_redirect off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

	index index.html;

    # 减少版本信息暴露；不替代安全更新
    server_tokens off;

    # 禁止浏览器猜测资源类型
    add_header X-Content-Type-Options "nosniff" always;

    # 只允许同源网页通过 iframe 嵌入本站
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 跨站请求只发送来源站点，减少路径信息泄露
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /index.html → /
    # 使用完整公网地址，避免内部出现在 Location 中
	if ($request_uri ~* ^/index\.html(\?.*)?$) {
		return 301 https://star.eva.cm/$1;
	}
	if ($request_uri ~* ^/(.+)\.html(\?.*)?$) {
		return 301 https://star.eva.cm/$1$2;
	}

	location / {
		try_files $uri $uri/ $uri.html =404;
	}

    location ~* \.(css|js|webp|jpg|jpeg|png|gif|ico|svg|woff2)$ {
        try_files $uri =404;
        expires 30d;
    }

    # 禁止访问隐藏文件，保留 .well-known 路径
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }
}

# 如果有两个域名想重定向到同一个, 就再写一个重定向server
# =========================================================
# 本机 HTTPS 8443：www.eva.cm 专用永久重定向
# =========================================================
server {
    listen 443 ssl;
    listen [::1]:443 ssl;
    server_name www.eva.cm;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # TLS 握手发生在返回 301 之前，因此这里仍然需要证书
    # 可以与 eva.cm 复用同一张、同时覆盖两个域名的证书
    ssl_certificate /path/to/fullchain.crt;
    ssl_certificate_key /path/to/cert/cert.key;

    # 不需要 root、index、location、安全响应头或缓存配置
    return 301 https://eva.cm$request_uri;
}
